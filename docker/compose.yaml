# Local PostgreSQL for ms-security. Works with `podman compose` and `docker compose`.
#
#   cd docker && podman compose up -d
#   source ../.env && ./gradlew :app-service:bootRun
#
# Or, from the project root:
#   podman compose -f docker/compose.yaml up -d
#
# The credentials here are local-development values and match .env.example. They are not
# secrets and must not be reused anywhere else.

# Fixed project name: without it, compose would derive one from this directory ("docker")
# and prefix the container and volume names with it.
name: ms-security

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: ms-security-db
    environment:
      POSTGRES_DB: security_db
      POSTGRES_USER: msagro
      POSTGRES_PASSWORD: msagro_local
    ports:
      - "5432:5432"
    volumes:
      - ms-security-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msagro -d security_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ms-security-pgdata:
    # Explicit name, so the volume is the same one whether it is created by compose or by
    # a plain `podman run` (see docker/README.md).
    name: ms-security-pgdata
