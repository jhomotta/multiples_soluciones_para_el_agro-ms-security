// ─────────────────────────────────────────────
// Module name: reactive-web
// Layer: Entry Point (Driving Adapter)
// Responsibility:
//  - Exposes REST APIs (Spring WebFlux)
//  - Controllers and request handling
//  - Maps HTTP requests to use cases
// ─────────────────────────────────────────────

plugins {
  id 'java'
}

dependencies {
  implementation project(':usecase')
  implementation project(':model')
  implementation project(':utility')

  implementation 'org.springframework.boot:spring-boot-starter-webflux'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  // For @AuthenticationPrincipal / ReactiveSecurityContextHolder on protected endpoints.
  implementation 'org.springframework.security:spring-security-core'
  // DataIntegrityViolationException lives in spring-tx's DAO support; the handler maps it to 409.
  implementation 'org.springframework:spring-tx'
  implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.25'
}
